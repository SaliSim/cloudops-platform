
name: CloudOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudops-platform:ci .

  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

  checkov-security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install checkov==3.3.30

      - name: Scan Terraform configuration
        run: checkov -d terraform/ --framework terraform

  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest

    needs:
      - test-and-build
      - terraform-check
      - checkov-security

    # Deployment remains disabled until GCP infrastructure is ready.
    if: github.event_name == 'push' && vars.ENABLE_GCP_DEPLOYMENT == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken(
              '//iam.googleapis.com/projects/486200743839/locations/global/workloadIdentityPools/cloudops-github-pool/providers/github-provider'
            );

            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            for (const key of [
              'sub',
              'repository',
              'ref',
              'aud',
              'repository_owner',
              'event_name'
            ]) {
              core.info(`${key}: ${claims[key] ?? 'NOT PRESENT'}`);
            }
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloudops-platform/cloudops-platform:${GITHUB_SHA}"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloudops-platform/cloudops-platform:${GITHUB_SHA}"

          gcloud run deploy cloudops-platform \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --quiet

      - name: Verify deployment
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          SERVICE_URL=$(gcloud run services describe cloudops-platform \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format="value(status.url)")

          echo "Cloud Run URL: $SERVICE_URL"

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            "$SERVICE_URL/health"